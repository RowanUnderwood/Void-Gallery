        class MazeGenerator {
            generate(size) {
                // size must be odd; recursive backtracker DFS
                const s = (size % 2 === 0) ? size + 1 : size;
                const grid = Array.from({ length: s }, () => new Array(s).fill(1));
                grid[1][1] = 0;
                const stack = [[1, 1]];
                while (stack.length > 0) {
                    const [r, c] = stack[stack.length - 1];
                    const nbrs = this._unvisited(grid, r, c, s);
                    if (nbrs.length > 0) {
                        const [nr, nc] = nbrs[Math.floor(Math.random() * nbrs.length)];
                        grid[(r + nr) >> 1][(c + nc) >> 1] = 0; // carve passage
                        grid[nr][nc] = 0;
                        stack.push([nr, nc]);
                    } else {
                        stack.pop();
                    }
                }
                return grid;
            }
            _unvisited(grid, r, c, s) {
                return [[r-2,c],[r+2,c],[r,c-2],[r,c+2]]
                    .filter(([nr,nc]) => nr>0 && nr<s-1 && nc>0 && nc<s-1 && grid[nr][nc]===1);
            }
            // Returns wall cells that border an open corridor — these are where paintings hang
            getWallFaces(grid) {
                const faces = [], rows = grid.length, cols = grid[0].length;
                const dirs = [
                    { face:'N', dr:-1, dc: 0 }, { face:'S', dr: 1, dc: 0 },
                    { face:'W', dr: 0, dc:-1 }, { face:'E', dr: 0, dc: 1 }
                ];
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (grid[r][c] === 1) {
                            dirs.forEach(({ face, dr, dc }) => {
                                const nr = r + dr, nc = c + dc;
                                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] === 0) {
                                    faces.push({ row: r, col: c, face, dr, dc });
                                }
                            });
                        }
                    }
                }
                return faces;
            }        }

        class MaterialManager {
            constructor() {
                this.materials = {};  // 'wall'|'floor'|'ceiling' → THREE.MeshStandardMaterial
                this.textures  = {};  // 'wall'|'floor'|'ceiling' → { color, normal, roughness }
            }
            _ext(folderName) {
                return folderName.toLowerCase().endsWith('-jpg') ? 'jpg' : 'png';
            }
            async load(surface, folderName) {
                const ext  = this._ext(folderName);
                const base = `./textures/${folderName}/${folderName}`;
                const loader = new THREE.TextureLoader();
                const loadTex = suffix => new Promise(resolve => {
                    loader.load(`${base}_${suffix}.${ext}`, tex => {
                        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                        resolve(tex);
                    }, undefined, () => resolve(null));
                });
                // Dispose old textures for this surface
                if (this.textures[surface]) {
                    Object.values(this.textures[surface]).forEach(t => { if (t) t.dispose(); });
                }
                const [colorTex, normalTex, roughnessTex] = await Promise.all([
                    loadTex('Color'), loadTex('NormalGL'), loadTex('Roughness')
                ]);
                // Per-surface tiling: floor/ceiling span 10 000 units, walls span MAZE_CELL_SIZE
                let rX, rY;
                if (surface === 'floor' || surface === 'ceiling') {
                    rX = rY = 2000 / (MAZE_CELL_SIZE / config.mazeTextureTiling);
                } else {
                    rX = config.mazeTextureTiling;
                    rY = rX * 1.5; // walls are 1.5× taller than wide
                }
                [colorTex, normalTex, roughnessTex].forEach(tex => {
                    if (tex) tex.repeat.set(rX, rY);
                });
                this.textures[surface] = { color: colorTex, normal: normalTex, roughness: roughnessTex };
                if (!this.materials[surface]) {
                    this.materials[surface] = new THREE.MeshStandardMaterial({ roughness: 1.0, metalness: 0.0 });
                }
                const mat = this.materials[surface];
                mat.map = colorTex;
                mat.normalMap = normalTex;
                mat.roughnessMap = roughnessTex;
                mat.needsUpdate = true;
                return mat;
            }
            updateTiling() {
                const surfaces = ['wall', 'floor', 'ceiling'];
                surfaces.forEach(surface => {
                    const group = this.textures[surface];
                    if (!group) return;
                    let rX, rY;
                    if (surface === 'floor' || surface === 'ceiling') {
                        rX = rY = 2000 / (MAZE_CELL_SIZE / config.mazeTextureTiling);
                    } else {
                        rX = config.mazeTextureTiling;
                        rY = rX * 1.5;
                    }
                    Object.values(group).forEach(tex => {
                        if (tex) { tex.repeat.set(rX, rY); tex.needsUpdate = true; }
                    });
                });
            }
            dispose() {
                Object.values(this.textures).forEach(group => {
                    if (group) Object.values(group).forEach(t => { if (t) t.dispose(); });
                });
                this.textures = {};
                Object.values(this.materials).forEach(m => { if (m) m.dispose(); });
                this.materials = {};
            }
        }

        async function init() {
            await loadConfigFromServer();

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, config.fogDensity);
            
            camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / window.innerHeight, 0.1, 3000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            stereoEffect = new StereoEffect(renderer);
            stereoEffect.setSize(window.innerWidth, window.innerHeight);
            
            stats = new Stats();
            document.getElementById('stats-container').appendChild(stats.dom);
            stats.dom.style.display = config.showStats ? 'block' : 'none';

            ambientLight = new THREE.AmbientLight(0xffffff, config.ambientIntensity);
            scene.add(ambientLight);

            setupLights();
            setupGUI();
            setupEvents();
            
            updateStereoSettings();
            
            textureManager.loadNumberedSequence();
        }

        function startExperience() {
            rebuildScene();
            hideLoading();
            if (!isRunning) { isRunning = true; animate(); }
        }

        function updateStereoSettings() {
            if (stereoEffect) {
                if (typeof stereoEffect.setEyeSeparation === 'function') {
                    stereoEffect.setEyeSeparation(config.stereoEyeSep);
                } else {
                    stereoEffect.eyeSeparation = config.stereoEyeSep;
                }
            }
            
            if (config.useStereo) document.body.classList.add('stereo-active');
            else document.body.classList.remove('stereo-active');

            if (camera) {
                if (config.useStereo) {
                    camera.fov = BASE_FOV + config.stereoFOVBoost;
                } else {
                    camera.fov = BASE_FOV;
                }
                camera.updateProjectionMatrix();
            }
            
            onWindowResize();
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (stereoEffect) stereoEffect.setSize(window.innerWidth, window.innerHeight);
        }

        function rebuildScene() {
            spawnQueue = [];

            // --- Maze Mode Cleanup ---
            mazeChunks.forEach(chunk => { scene.remove(chunk.mesh); chunk.mesh.geometry.dispose(); });
            mazeChunks = [];
            mazePaintings.forEach(p => { 
                scene.remove(p.mesh); 
                p.mesh.children.forEach(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) safeDisposeMaterial(child.material);
                });
            });
            mazePaintings = [];
            mazeSpotlights.forEach(s => { 
                scene.remove(s.light); scene.remove(s.target); s.light.dispose(); 
                if (s.mesh) {
                    scene.remove(s.mesh);
                    s.mesh.children.forEach(c => {
                        if (c.geometry) c.geometry.dispose();
                        if (c.material) safeDisposeMaterial(c.material);
                    });
                }
            });
            mazeSpotlights = [];
            if (materialManager) { materialManager.dispose(); materialManager = null; }
            if (mazeFloor)   { scene.remove(mazeFloor);   mazeFloor.geometry.dispose();   mazeFloor   = null; }
            if (mazeCeiling) { scene.remove(mazeCeiling); mazeCeiling.geometry.dispose(); mazeCeiling = null; }
            if (mazeExitObject) {
                scene.remove(mazeExitObject.group);
                mazeExitObject.mesh.geometry.dispose();
                safeDisposeMaterial(mazeExitObject.mesh.material);
                mazeExitObject.mesh.children[0].geometry.dispose();
                safeDisposeMaterial(mazeExitObject.mesh.children[0].material);
                mazeExitObject.light.dispose();
                mazeExitObject = null;
            }
            mazeExit = null;
            mazeRegenerating = false;
            mazeNav.phase = 'idle';

            imageCards.forEach(c => {
                scene.remove(c.mesh);
                if (c.mesh.geometry && c.mesh.geometry !== sharedPlaneGeometry && c.mesh.geometry !== tunnelGeometry) {
                    c.mesh.geometry.dispose();
                }
                if (c.mesh.material) safeDisposeMaterial(c.mesh.material);
            });
            imageCards = [];
            
            gridLayers.forEach(layerGroup => {
                scene.remove(layerGroup);
                layerGroup.children.forEach(mesh => {
                    if(mesh.material) safeDisposeMaterial(mesh.material);
                });
            });
            gridLayers = [];

            textureUploadQueue = [];

            if (tunnelGeometry) {
                tunnelGeometry.dispose();
                tunnelGeometry = null;
            }

            camera.position.set(0,0,0);
            camera.rotation.set(0,0,0);

            if (config.mode === 'floating') {
                for (let i = 0; i < config.totalImages; i++) spawnFloatingImage(true);
            } else if (config.mode === 'tunnel') {
                setupTunnelGrid();
            } else if (config.mode === 'grid') {
                setupGridSystem();
            } else if (config.mode === 'maze') {
                showLoading('Building Maze...', 'Generating layout...');
                setupMazeMode().then(() => hideLoading());
            }
            updateGUIVisibility();
        }
        
        function safeDisposeMaterial(mat) {
            if (mat.map) mat.map.dispose();
            mat.dispose();
        }

        function processSpawnQueue() {
            if (spawnQueue.length === 0) return;
            
            // Higher key = spawn sooner. Maze paintings use camera distance; other modes use world z (camera looks down -Z).
            const spawnPriority = (t) => {
                if (t.type === 'maze_painting') return -camera.position.distanceToSquared(t.worldPos);
                return t.parent ? t.parent.position.z + t.z : t.z;
            };
            spawnQueue.sort((a, b) => spawnPriority(b) - spawnPriority(a));

            while (spawnQueue.length > 0) {
                // Only pull a texture when a task is waiting for it, otherwise it is consumed and never used
                const textureData = textureManager.getTextureFromBuffer();
                if (!textureData) break;
                const task = spawnQueue.shift();
                
                // forceSinglePass: three.js otherwise draws transparent DoubleSide materials twice
                // (back then front) and sets material.needsUpdate before each pass, forcing a shader
                // program lookup per image per frame. Pointless for flat cards; it was the main CPU cost.
                const material = new THREE.MeshLambertMaterial({
                    map: textureData.texture, side: THREE.DoubleSide, transparent: true,
                    opacity: config.opacity, depthWrite: false, depthTest: true, forceSinglePass: true
                });

                let mesh;
                if (task.type === 'tunnel') {
                    const geo = tunnelGeometry.clone();
                    mesh = new THREE.Mesh(geo, material);
                    mesh.position.set(task.x, task.y, task.z);
                    mesh.rotation.z = task.rotationZ;
                    updateTileUVs(mesh, textureData.ratio, task.colIndex);
                } else if (task.type === 'maze_painting') {
                    // --- REFINED SOLID PICTURE FRAME ASSEMBLY ---
                    const pW = MAZE_CELL_SIZE * 0.58;
                    let pH = pW / textureData.ratio; 

                    // Group sits exactly on the wall surface
                    const deepOffset = MAZE_CELL_SIZE * 0.5; 
                    const paintingY = MAZE_CELL_SIZE * 1.5 * 0.5;

                    const group = new THREE.Group();

                    // 1. THE THICK, SOLID FRAME (The physical gasket)
                    const frameWidth = 1.1;  // Slightly wider than the image
                    const frameDepth = 0.8;  // Very thick box
                    const frameGeo = new THREE.BoxGeometry(pW + frameWidth, pH + frameWidth, frameDepth);
                    const frameMat = new THREE.MeshStandardMaterial({ 
                        color: 0x1a110a, // Dark matte finish
                        roughness: 0.9, 
                        metalness: 0.1 
                    });
                    const frameMesh = new THREE.Mesh(frameGeo, frameMat);
                    frameMesh.castShadow = true;
                    frameMesh.receiveShadow = true;
                    frameMesh.position.z = 0; // Half in the wall, half out
                    group.add(frameMesh);
                    
                    // 1b. FAKE AO GASKET — unlit black border flush with wall to hide light bleed
                    const aoMargin = .1; // how far it extends past the frame edge
                    const aoGeo = new THREE.PlaneGeometry(pW + frameWidth + aoMargin * 2, pH + frameWidth + aoMargin * 2);
                    const aoMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                    const aoMesh = new THREE.Mesh(aoGeo, aoMat);
                    aoMesh.position.z = 0.01; // just in front of wall surface (z=0 is the wall)
                    aoMesh.castShadow = false;
                    aoMesh.receiveShadow = false;
                    group.add(aoMesh);
                    
                    // 2. THE THIN, DARK BACKGROUND PLANE (Z-Fighting blocker)
                    const bgPlaneGeo = new THREE.PlaneGeometry(pW + frameWidth * 0.8, pH + frameWidth * 0.8);
                    const bgPlaneMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                    const bgPlaneMesh = new THREE.Mesh(bgPlaneGeo, bgPlaneMat);
                    bgPlaneMesh.position.z = frameDepth / 2 - 0.05; // Slightly recessed inside the front of the frame
                    group.add(bgPlaneMesh);

                    // 3. THE IMAGE CANVAS
                    const imgGeo = new THREE.PlaneGeometry(pW, pH);
                    const imgMesh = new THREE.Mesh(imgGeo, material);
                    imgMesh.position.z = frameDepth / 2 + 0.01; // Slightly in front of frame/background plane
                    imgMesh.castShadow = false; 
                    imgMesh.receiveShadow = true; // MUST receive shadows so it doesn't glow in the dark
                    group.add(imgMesh);

                    // --- APPLY WORLD POSITION AND ROTATION ---
                    const wallX = task.face.col * MAZE_CELL_SIZE;
                    const wallZ = task.face.row * MAZE_CELL_SIZE;
                    group.position.set(
                        wallX + task.face.dc * deepOffset, 
                        paintingY, 
                        wallZ + task.face.dr * deepOffset
                    );
                    group.rotation.y = PAINTING_ROT_Y[task.face.face];
                    
                    if (task.parent) task.parent.add(group);
                    else scene.add(group);
                    
                    // Track the entire group for the spotlights to follow
                    mazePaintings.push({ mesh: group, normalDir: new THREE.Vector3(task.face.dc, 0, task.face.dr) });
                    continue; // group already added; skip the generic mesh add below
                } else {
                    let w = task.w;
                    let h = task.h;
                    if (textureData.ratio > 1) h = w / textureData.ratio;
                    else w = h * textureData.ratio;

                    mesh = new THREE.Mesh(sharedPlaneGeometry, material);
                    mesh.scale.set(w, h, 1);
                    mesh.position.set(task.x, task.y, task.z);
                    if (task.rotation) mesh.rotation.copy(task.rotation);
                }
                
                if (task.parent) task.parent.add(mesh);
                else scene.add(mesh);
                
                if (task.onComplete) task.onComplete(mesh);
            }
        }

        function setupGridSystem() {
            if (!config.gridCols) config.gridCols = 6;
            if (!config.gridRows) config.gridRows = 4;
            if (!config.gridSpacing) config.gridSpacing = 400;
            if (!config.imageSize) config.imageSize = 60;

            const layersToSpawn = 5;
            nextGridTargetIndex = {
                c: Math.floor(config.gridCols / 2),
                r: Math.floor(config.gridRows / 2)
            };
            currentGridTarget.set(0,0,0);
            calculateTargetPosition(nextGridTargetIndex);

            if (!isNaN(currentGridTarget.x)) {
                camera.position.x = currentGridTarget.x;
                camera.position.y = currentGridTarget.y;
            } else {
                camera.position.set(0,0,0);
            }
            for(let i=0; i<layersToSpawn; i++) spawnGridLayer(i * -config.gridSpacing - 400); 
        }

        function spawnGridLayer(zPos) {
            const group = new THREE.Group();
            group.position.z = zPos;
            createGridTasks(group);
            scene.add(group);
            gridLayers.push(group);
        }

        function recycleGridLayer(group) {
            let minZ = 0;
            gridLayers.forEach(g => { if(g.position.z < minZ) minZ = g.position.z; });
            group.position.z = minZ - config.gridSpacing;
            for (let i = group.children.length - 1; i >= 0; i--) {
                const mesh = group.children[i];
                if (mesh.material) safeDisposeMaterial(mesh.material);
                group.remove(mesh);
            }
            spawnQueue = spawnQueue.filter(task => task.parent !== group);
            createGridTasks(group);
            pickNextTarget();
        }

        function createGridTasks(group) {
            const cols = config.gridCols || 6;
            const rows = config.gridRows || 4;
            const size = config.imageSize || 60;
            const totalWidth = cols * size;
            const totalHeight = rows * size;
            const offX = (totalWidth / 2) - (size / 2);
            const offY = (totalHeight / 2) - (size / 2);
            const centerC = Math.floor(cols / 2);
            const centerR = Math.floor(rows / 2);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = (c * size) - offX;
                    const y = (r * size) - offY;
                    const dist = Math.sqrt(Math.pow(c - centerC, 2) + Math.pow(r - centerR, 2));
                    spawnQueue.push({
                        type: 'grid',
                        parent: group,
                        x: x, y: y, z: 0,
                        w: size, h: size, dist: dist 
                    });
                }
            }
        }

        function pickNextTarget() {
            const cols = config.gridCols || 6;
            const rows = config.gridRows || 4;
            const margin = config.gridEdgeBuffer || 0; 
            const maxDevC = Math.max(1, Math.round(cols * (config.pathRandomness || 0.3)));
            const maxDevR = Math.max(1, Math.round(rows * (config.pathRandomness || 0.3)));
            const stepC = Math.floor(Math.random() * (maxDevC * 2 + 1)) - maxDevC;
            const stepR = Math.floor(Math.random() * (maxDevR * 2 + 1)) - maxDevR;
            let nextC = nextGridTargetIndex.c + stepC;
            let nextR = nextGridTargetIndex.r + stepR;
            if (cols > margin * 2) { nextC = Math.max(margin, Math.min(cols - 1 - margin, nextC)); } 
            else { nextC = Math.max(0, Math.min(cols - 1, nextC)); }
            if (rows > margin * 2) { nextR = Math.max(margin, Math.min(rows - 1 - margin, nextR)); } 
            else { nextR = Math.max(0, Math.min(rows - 1, nextR)); }
            nextGridTargetIndex = { c: nextC, r: nextR };
            calculateTargetPosition(nextGridTargetIndex);
        }

        function calculateTargetPosition(indices) {
            const cols = config.gridCols || 6;
            const rows = config.gridRows || 4;
            const size = config.imageSize || 60;
            const totalWidth = cols * size;
            const totalHeight = rows * size;
            const offX = (totalWidth / 2) - (size / 2);
            const offY = (totalHeight / 2) - (size / 2);
            const x = (indices.c * size) - offX;
            const y = (indices.r * size) - offY;
            currentGridTarget.set(x, y, 0);
        }

        function spawnFloatingImage(randomZ = false) {
            const angle = Math.random() * Math.PI * 2;
            const r = (Math.random() * 0.5 + 0.5) * config.tunnelRadius;
            const z = randomZ ? -Math.random() * 1000 : -1000;
            const rot = new THREE.Euler();
            if (!config.noRotation) rot.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
            else rot.set(0,0,0);
            spawnQueue.push({
                type: 'floating',
                x: Math.cos(angle) * r, 
                y: Math.sin(angle) * r, 
                z: z,
                w: config.imageSize, 
                h: config.imageSize,
                rotation: rot,
                onComplete: (mesh) => {
                    imageCards.push({
                        mesh: mesh,
                        rotationSpeed: new THREE.Vector3((Math.random()-0.5)*config.rotationSpeed, (Math.random()-0.5)*config.rotationSpeed, (Math.random()-0.5)*config.rotationSpeed),
                        velocity: (Math.random() * 0.5 + 1.0)
                    });
                }
            });
        }

        function setupTunnelGrid() {
            const circumference = 2 * Math.PI * config.tunnelRadius;
            const approxWidth = config.imageSize * 1.2;
            const cols = Math.floor(circumference / approxWidth);
            const segmentAngle = (Math.PI * 2) / cols;
            const rowHeight = config.imageSize * 1.2;
            const rows = config.tunnelRows;
            
            tunnelGrid = {
                cols: cols, rows: rows, rowHeight: rowHeight, segmentAngle: segmentAngle,
                totalDepth: rows * rowHeight,
                cellWidth: segmentAngle * config.tunnelRadius
            };

            const gap = 0.95;
            tunnelGeometry = new THREE.CylinderGeometry(
                config.tunnelRadius, config.tunnelRadius, config.imageSize, 
                16, 1, true, -(segmentAngle * gap) / 2, segmentAngle * gap
            );
            tunnelGeometry.rotateX(Math.PI / 2); 
            
            const uvs = tunnelGeometry.attributes.uv;
            let minU = Infinity, maxU = -Infinity;
            for(let i=0; i<uvs.count; i++) {
                minU = Math.min(minU, uvs.getX(i));
                maxU = Math.max(maxU, uvs.getX(i));
            }
            const range = maxU - minU;
            if (range > 0) {
                for(let i=0; i<uvs.count; i++) {
                    uvs.setX(i, (uvs.getX(i) - minU) / range);
                }
            }
            tunnelGeometry.userData.baseUVs = Float32Array.from(uvs.array);
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    spawnTunnelTask(r, c);
                }
            }
        }

        function spawnTunnelTask(row, col) {
            const zPos = - (row * tunnelGrid.rowHeight);
            const rotationZ = (col * tunnelGrid.segmentAngle) + Math.PI / 2;
            spawnQueue.push({
                type: 'tunnel',
                x: 0, y: 0, z: zPos,
                rotationZ: rotationZ,
                colIndex: col,
                onComplete: (mesh) => {
                    imageCards.push({ mesh, colIndex: col });
                }
            });
        }

        // =============================================
        // MAZE MODE FUNCTIONS
        // =============================================

        function cellToWorld(row, col) {
            return new THREE.Vector3(col * MAZE_CELL_SIZE, MAZE_CELL_SIZE * 0.6, row * MAZE_CELL_SIZE);
        }

        function canMazeMove(row, col, dir) {
            if (!mazeGrid) return false;
            const [dr, dc] = FACE_DIR_MAP[dir];
            const size = mazeGrid.length, cols = mazeGrid[0].length;
            const pr = row + dr, pc = col + dc;
            const nr = row + dr * 2, nc = col + dc * 2;
            if (pr < 0 || pr >= size || pc < 0 || pc >= cols) return false;
            if (nr < 0 || nr >= size || nc < 0 || nc >= cols) return false;
            return mazeGrid[pr][pc] === 0 && mazeGrid[nr][nc] === 0;
        }

        function advanceMazeNav() {
            mazeNav.currentCell = { row: mazeNav.targetCell.row, col: mazeNav.targetCell.col };
            const { row, col } = mazeNav.currentCell;

            // Check if we reached the exit
            if (mazeExit && row === mazeExit.row && col === mazeExit.col) {
                if (!mazeRegenerating) { mazeRegenerating = true; regenerateMaze(); }
                return;
            }

            const turns = TURN_MAP[mazeNav.facing];
            const options = [turns.straight, turns.right, turns.left];
            
            // Randomly shuffle forward-moving options so we explore organically
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            // Add 'back' at the very end — ONLY used if it's a dead end
            options.push(turns.back);

            let chosenDir = null;
            for (const dir of options) {
                if (canMazeMove(row, col, dir)) { chosenDir = dir; break; }
            }
            if (!chosenDir) { mazeRegenerating = true; regenerateMaze(); return; }

            if (chosenDir !== mazeNav.facing) {
                // Turn needed before moving
                mazeNav.startQuat.copy(camera.quaternion);
                mazeNav.endQuat.setFromEuler(new THREE.Euler(0, FACE_ROT_Y[chosenDir], 0, 'YXZ'));
                mazeNav.facing = chosenDir;
                mazeNav.phase = 'turning';
                mazeNav.progress = 0;
            } else {
                startMazeMoving();
            }
        }

        function startMazeMoving() {
            const { row, col } = mazeNav.currentCell;
            const [dr, dc] = FACE_DIR_MAP[mazeNav.facing];
            const nr = row + dr * 2, nc = col + dc * 2;
            mazeNav.targetCell = { row: nr, col: nc };
            mazeNav.startPos.copy(camera.position);
            mazeNav.endPos.copy(cellToWorld(nr, nc));
            mazeNav.startPos.y = MAZE_CELL_SIZE * 0.6;
            mazeNav.phase = 'moving';
            mazeNav.progress = 0;
            mazeNav.headBobTime = 0;
        }

        function updateMazeCamera(dt) {
            const STEP_DURATION = 1.2 / Math.max(0.1, config.mazeWalkingSpeed);
            // Modern: turn overlaps with forward drift; Win95: crisp stop-and-turn
            const TURN_DURATION = config.navStyle === 'modern' ? STEP_DURATION * 0.8 : 0.25;

            if (mazeNav.phase === 'turning') {
                mazeNav.progress = Math.min(mazeNav.progress + dt / TURN_DURATION, 1.0);
                const ease = mazeNav.progress * mazeNav.progress * (3 - 2 * mazeNav.progress);
                camera.quaternion.slerpQuaternions(mazeNav.startQuat, mazeNav.endQuat, ease);
                // Modern: push slightly forward into the curve during the turn
                if (config.navStyle === 'modern' && mazeNav.progress > 0.3) {
                    camera.translateZ(-config.mazeWalkingSpeed * dt * 8);
                }
                if (mazeNav.progress >= 1.0) startMazeMoving();
            }

            if (mazeNav.phase === 'moving') {
                mazeNav.progress = Math.min(mazeNav.progress + dt / STEP_DURATION, 1.0);
                mazeNav.headBobTime += dt * Math.PI * 2;
                const ease = mazeNav.progress * mazeNav.progress * (3 - 2 * mazeNav.progress);
                camera.position.lerpVectors(mazeNav.startPos, mazeNav.endPos, ease);
                if (mazeNav.progress >= 1.0) advanceMazeNav();
            }

            // Apply head height (bob for win95, flat for modern)
            camera.position.y = MAZE_CELL_SIZE * 0.6 + (config.navStyle === 'win95' ? Math.sin(mazeNav.headBobTime) * 0.35 : 0);

            // Modern mouse-look: absolute offset from base facing — no per-frame accumulation
            if (config.navStyle === 'modern' && mazeNav.phase === 'moving') {
                const baseQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, FACE_ROT_Y[mazeNav.facing], 0, 'YXZ'));
                const yawQ   = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -mouse.x * 0.4);
                const pitchQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0),  mouse.y * 0.2);
                camera.quaternion.copy(baseQuat).multiply(yawQ).multiply(pitchQ);
            }
        }

        function setupMazeSpotlights() {
            mazeSpotlights.forEach(s => { 
                scene.remove(s.light); scene.remove(s.target); s.light.dispose(); 
                if (s.mesh) {
                    scene.remove(s.mesh);
                    s.mesh.children.forEach(c => {
                        if (c.geometry) c.geometry.dispose();
                        if (c.material) safeDisposeMaterial(c.material);
                    });
                }
            });
            mazeSpotlights = [];
            const POOL = 6;
            for (let i = 0; i < POOL; i++) {
                const color = config.lightColorMode === 'random' ? new THREE.Color().setHSL(Math.random(), 1, 0.5) : new THREE.Color(0xfff5e0);
                const light = new THREE.SpotLight(color, 0, 70, config.mazeSpotlightAngle, 0.4);
                const target = new THREE.Object3D();
                light.target = target;
                
                light.castShadow = true;
                light.shadow.mapSize.width = config.mazeShadowRes;
                light.shadow.mapSize.height = config.mazeShadowRes;
                light.shadow.camera.near = 1;
                light.shadow.camera.far = 70;
                light.shadow.bias = -0.0001;
                light.shadow.normalBias = 0.01;
                
                const mesh = new THREE.Group();
                const housingGeo = new THREE.CylinderGeometry(0.8, 0.8, 2, 16);
                const housingMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.2 });
                const housing = new THREE.Mesh(housingGeo, housingMat);
                housing.rotation.x = Math.PI / 2;
                
                const lensGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.2, 16);
                const lensMat = new THREE.MeshBasicMaterial({ color: color });
                const lens = new THREE.Mesh(lensGeo, lensMat);
                lens.rotation.x = Math.PI / 2;
                lens.position.z = 1.0;
                
                mesh.add(housing);
                mesh.add(lens);
                
                scene.add(mesh);
                scene.add(light);
                scene.add(target);
                mazeSpotlights.push({ light, target, mesh });
            }
        }

        function updateSpotlightAssignments() {
            if (mazePaintings.length === 0 || mazeSpotlights.length === 0) return;
            const camPos = camera.position;
            const sorted = mazePaintings
                .map(p => ({ p, dist: camPos.distanceTo(p.mesh.position) }))
                .sort((a, b) => a.dist - b.dist);

            let activeLights = 0;

            mazeSpotlights.forEach((sl) => {
                sl.light.intensity = 0;
                // Skip this light's shadow pass while idle. Toggling castShadow instead would force a shader recompile.
                sl.light.shadow.autoUpdate = false;
                if (sl.mesh) sl.mesh.visible = false;
            });

            for (let i = 0; i < sorted.length; i++) {
                if (activeLights >= mazeSpotlights.length) break;
                if (sorted[i].dist > 120) continue;

                const { p, dist } = sorted[i];
                const pp = p.mesh.position;

                // Raycast check: Ensure no wall is blocking the line of sight
                rayDirection.subVectors(pp, camPos).normalize();
                raycaster.set(camPos, rayDirection);
                // Check against the InstancedMesh wall chunks
                const intersects = raycaster.intersectObject(mazeChunks[0].mesh);

                // If we hit a wall AND that wall is significantly closer than the painting, it's blocked.
                if (intersects.length > 0 && intersects[0].distance < dist - 1.0) {
                    continue; 
                }

                const sl = mazeSpotlights[activeLights];
                
                // Center the light closely in front of and slightly above the painting
                sl.light.position.set(pp.x + p.normalDir.x * 2, pp.y + config.mazeSpotlightHeight, pp.z + p.normalDir.z * 2);
                sl.target.position.copy(pp);
                sl.target.updateMatrixWorld();
                sl.light.intensity = config.lightIntensity;
                sl.light.shadow.autoUpdate = true;

                // Update physical housing
                if (sl.mesh) {
                    sl.mesh.position.copy(sl.light.position);
                    sl.mesh.lookAt(sl.target.position);
                    sl.mesh.visible = true;
                }
                
                activeLights++;
            }

            // --- Raycast check for the Exit Portal ---
            if (mazeExitObject) {
                const exitPos = mazeExitObject.group.position.clone();
                exitPos.y = MAZE_CELL_SIZE * 0.6; // Match camera height
                const distToExit = camPos.distanceTo(exitPos);
                
                if (distToExit > 200) {
                    mazeExitObject.group.visible = false;
                } else {
                    rayDirection.subVectors(exitPos, camPos).normalize();
                    raycaster.set(camPos, rayDirection);
                    const intersects = raycaster.intersectObject(mazeChunks[0].mesh);
                    if (intersects.length > 0 && intersects[0].distance < distToExit - 1.0) {
                        mazeExitObject.group.visible = false;
                    } else {
                        mazeExitObject.group.visible = true;
                    }
                }
            }
        }

        function spawnMazePaintings() {
            if (!mazeGrid) return;
            const wallFaces = mazeGen.getWallFaces(mazeGrid);
            const shuffled = [...wallFaces].sort(() => Math.random() - 0.5).slice(0, config.mazeImageCount || 55);
            // Push into spawnQueue so textures arrive gradually without draining the buffer
            for (const face of shuffled) {
                spawnQueue.push({
                    type: 'maze_painting',
                    face: face,
                    // used by sort: paintings nearest the camera spawn first
                    worldPos: new THREE.Vector3(face.col * MAZE_CELL_SIZE, 0, face.row * MAZE_CELL_SIZE)
                });
            }
        }

        async function buildMazeGeometry() {
            const wallHeight = MAZE_CELL_SIZE * 1.5;
            const wallPositions = [];
            for (let r = 0; r < mazeGrid.length; r++) {
                for (let c = 0; c < mazeGrid[0].length; c++) {
                    if (mazeGrid[r][c] === 1) wallPositions.push([c * MAZE_CELL_SIZE, (wallHeight / 2) - 2, r * MAZE_CELL_SIZE]);
                }
            }

            const wallGeo = new THREE.BoxGeometry(MAZE_CELL_SIZE, wallHeight + 4, MAZE_CELL_SIZE);
            const wallMesh = new THREE.InstancedMesh(wallGeo, materialManager.materials.wall, wallPositions.length);
            wallMesh.castShadow = true;
            wallMesh.receiveShadow = true;
            const matrix = new THREE.Matrix4();
            wallPositions.forEach(([x, y, z], i) => { matrix.makeTranslation(x, y, z); wallMesh.setMatrixAt(i, matrix); });
            wallMesh.instanceMatrix.needsUpdate = true;
            scene.add(wallMesh);
            mazeChunks.push({ mesh: wallMesh });

            // Floor and ceiling planes, scaled down and centered to prevent texture jitter
            const bounds = mazeGrid.length * MAZE_CELL_SIZE;
            const floorGeo = new THREE.PlaneGeometry(2000, 2000);
            mazeFloor = new THREE.Mesh(floorGeo, materialManager.materials.floor);
            mazeFloor.rotation.x = -Math.PI / 2;
            mazeFloor.position.set(bounds / 2, 0, bounds / 2);
            mazeFloor.receiveShadow = true;
            scene.add(mazeFloor);

            const ceilGeo = new THREE.PlaneGeometry(2000, 2000);
            mazeCeiling = new THREE.Mesh(ceilGeo, materialManager.materials.ceiling);
            mazeCeiling.rotation.x = Math.PI / 2;
            mazeCeiling.position.set(bounds / 2, wallHeight, bounds / 2);
            mazeCeiling.receiveShadow = true;
            scene.add(mazeCeiling);

            setupMazeSpotlights();
            spawnMazePaintings();

            // Position camera at start cell (center of the maze)
            const center = Math.floor(mazeGrid.length / 2);
            const startIdx = center % 2 === 0 ? center + 1 : center;
            const startPos = cellToWorld(startIdx, startIdx);

            // Find the furthest open cell from the start to act as the exit
            let maxDist = -1;
            let furthestCell = { row: startIdx, col: startIdx };
            
            for (let r = 1; r < mazeGrid.length - 1; r += 2) {
                for (let c = 1; c < mazeGrid[0].length - 1; c += 2) {
                    if (mazeGrid[r][c] === 0) {
                        const dist = Math.abs(r - startIdx) + Math.abs(c - startIdx);
                        if (dist > maxDist) {
                            maxDist = dist;
                            furthestCell = { row: r, col: c };
                        }
                    }
                }
            }
            mazeExit = furthestCell;

            // Build the Exit Portal (Spinning Crystal + Light)
            const exitGroup = new THREE.Group();
            const exitGeo = new THREE.OctahedronGeometry(3);
            const exitMat = new THREE.MeshStandardMaterial({ 
                color: 0x00ffff, emissive: 0x00aaee, emissiveIntensity: 0.8, 
                wireframe: true, transparent: true, opacity: 0.9 
            });
            const exitMesh = new THREE.Mesh(exitGeo, exitMat);
            exitMesh.position.y = MAZE_CELL_SIZE * 0.6;
            
            const innerGeo = new THREE.OctahedronGeometry(1.5);
            const innerMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const innerMesh = new THREE.Mesh(innerGeo, innerMat);
            exitMesh.add(innerMesh);

            const exitLight = new THREE.PointLight(0x00ffff, 2000, 150);
            exitLight.position.y = MAZE_CELL_SIZE * 0.6;
            exitLight.castShadow = true;
            exitLight.shadow.mapSize.width = 512;
            exitLight.shadow.mapSize.height = 512;
            exitLight.shadow.bias = -0.001;
            
            exitGroup.add(exitMesh);
            exitGroup.add(exitLight);
            
            const exitPos = cellToWorld(mazeExit.row, mazeExit.col);
            exitGroup.position.set(exitPos.x, 0, exitPos.z);
            scene.add(exitGroup);
            
            mazeExitObject = { group: exitGroup, mesh: exitMesh, light: exitLight };

            camera.position.copy(startPos);
            camera.quaternion.setFromEuler(new THREE.Euler(0, Math.PI, 0, 'YXZ')); // face south

            // Initialize navigation — progress=1 triggers advanceMazeNav on first frame
            mazeNav.currentCell = { row: startIdx, col: startIdx };
            mazeNav.targetCell  = { row: startIdx, col: startIdx };
            mazeNav.facing = 'S';
            mazeNav.startPos.copy(startPos);
            mazeNav.endPos.copy(startPos);
            mazeNav.phase = 'moving';
            mazeNav.progress = 1.0;
        }

        async function setupMazeMode() {
            mazeGen = new MazeGenerator();
            const size = (config.mazeComplexity % 2 === 0) ? config.mazeComplexity + 1 : config.mazeComplexity;
            mazeGrid = mazeGen.generate(size);

            // Load textures only on first call — reuse materialManager on regeneration
            if (!materialManager) {
                materialManager = new MaterialManager();
                await Promise.all([
                    materialManager.load('wall',    config.mazeWallTexture),
                    materialManager.load('floor',   config.mazeFloorTexture),
                    materialManager.load('ceiling', config.mazeCeilingTexture)
                ]);
            }
            await buildMazeGeometry();
        }

        async function regenerateMaze() {
            // Classic Win95 style 3D flip transition
            const container = document.getElementById('canvas-container');
            container.style.transition = 'transform 0.4s ease-in-out';
            container.style.transform = 'rotateY(90deg)';
            
            await new Promise(resolve => setTimeout(resolve, 400));

            // Dispose maze geometry — NOT MaterialManager (textures are reused)
            mazeChunks.forEach(chunk => { scene.remove(chunk.mesh); chunk.mesh.geometry.dispose(); });
            mazeChunks = [];
            mazePaintings.forEach(p => { 
                scene.remove(p.mesh); 
                p.mesh.children.forEach(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) safeDisposeMaterial(child.material);
                });
            });
            mazePaintings = [];
            // Clear any pending maze_painting tasks from the old maze
            spawnQueue = spawnQueue.filter(t => t.type !== 'maze_painting');
            mazeSpotlights.forEach(s => { 
                scene.remove(s.light); scene.remove(s.target); s.light.dispose(); 
                if (s.mesh) {
                    scene.remove(s.mesh);
                    s.mesh.children.forEach(c => {
                        if (c.geometry) c.geometry.dispose();
                        if (c.material) safeDisposeMaterial(c.material);
                    });
                }
            });
            mazeSpotlights = [];
            if (mazeFloor)   { scene.remove(mazeFloor);   mazeFloor.geometry.dispose();   mazeFloor   = null; }
            if (mazeCeiling) { scene.remove(mazeCeiling); mazeCeiling.geometry.dispose(); mazeCeiling = null; }
            if (mazeExitObject) {
                scene.remove(mazeExitObject.group);
                mazeExitObject.mesh.geometry.dispose();
                safeDisposeMaterial(mazeExitObject.mesh.material);
                mazeExitObject.mesh.children[0].geometry.dispose();
                safeDisposeMaterial(mazeExitObject.mesh.children[0].material);
                mazeExitObject.light.dispose();
                mazeExitObject = null;
            }
            mazeExit = null;

            const size = (config.mazeComplexity % 2 === 0) ? config.mazeComplexity + 1 : config.mazeComplexity;
            mazeGrid = mazeGen.generate(size);
            await buildMazeGeometry();

            // Render a single frame to ensure new geometry is drawn before flipping back
            renderer.render(scene, camera);

            container.style.transform = 'rotateY(0deg)';
            await new Promise(resolve => setTimeout(resolve, 400));
            container.style.transition = 'none';

            mazeRegenerating = false;
        }

        function updateTileUVs(mesh, ratio, colIndex) {
            const baseUVs = mesh.geometry.userData.baseUVs || tunnelGeometry.userData.baseUVs;
            const uvs = mesh.geometry.attributes.uv;
            uvs.array.set(baseUVs);
            let baseRot = config.tunnelRotation;
            const angle = (colIndex * tunnelGrid.segmentAngle) % (Math.PI * 2);
            let flip = false;
            if (angle > Math.PI / 2 && angle < 3 * Math.PI / 2) flip = true;
            if (flip) baseRot += 180;
            let effectiveRatio = ratio;
            const totalRot = (baseRot % 360);
            const isPortrait = Math.abs((totalRot % 180) - 90) < 1; 
            if (isPortrait) effectiveRatio = 1 / ratio;
            const cellRatio = tunnelGrid.cellWidth / config.imageSize;
            let scaleX = 1, scaleY = 1;
            if (effectiveRatio > cellRatio) scaleY = (tunnelGrid.cellWidth / effectiveRatio) / config.imageSize;
            else scaleX = (config.imageSize * effectiveRatio) / tunnelGrid.cellWidth;
            const rX = scaleX; 
            const rY = scaleY;
            for (let i = 0; i < uvs.count; i++) {
                let u = uvs.getX(i);
                let v = uvs.getY(i);
                u = 1 - u; 
                let r = (baseRot % 360 + 360) % 360;
                if (r === 90) { const t = u; u = v; v = 1 - t; }
                else if (r === 180) { u = 1 - u; v = 1 - v; }
                else if (r === 270) { const t = u; u = 1 - v; v = t; }
                u = u * rX + (1 - rX) / 2;
                v = v * rY + (1 - rY) / 2;
                uvs.setXY(i, u, v);
            }
            uvs.needsUpdate = true;
        }

        function updateMazeMap() {
            const canvas = document.getElementById('maze-map');
            
            // Only show the map if we are in maze mode and the toggle is on
            if (config.mode !== 'maze' || !config.showMazeMap || !mazeGrid) {
                canvas.style.display = 'none';
                return;
            }
            canvas.style.display = 'block';

            const ctx = canvas.getContext('2d');
            const size = mazeGrid.length;
            const cellSize = canvas.width / size;

            // Clear the previous frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw the Walls
            ctx.fillStyle = 'rgba(120, 120, 120, 0.8)';
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (mazeGrid[r][c] === 1) {
                        // Adding +0.5 prevents tiny gaps between canvas shapes
                        ctx.fillRect(c * cellSize, r * cellSize, cellSize + 0.5, cellSize + 0.5); 
                    }
                }
            }

            // --- NEW: Draw the Exit Marker ---
            if (mazeExit) {
                ctx.fillStyle = 'rgba(0, 255, 255, 0.8)';
                ctx.fillRect(mazeExit.col * cellSize, mazeExit.row * cellSize, cellSize, cellSize);
            }

            // 2. Draw the Player Marker
            // Convert 3D World space back to 2D Grid space (add 0.5 offset to center within cell)
            const mapX = (camera.position.x / MAZE_CELL_SIZE + 0.5) * cellSize;
            const mapY = (camera.position.z / MAZE_CELL_SIZE + 0.5) * cellSize;

            ctx.save();
            ctx.translate(mapX, mapY);
            
            // Map the Three.js Y-rotation to the Canvas 2D rotation
            ctx.rotate(-camera.rotation.y); 

            // Draw a red "paper airplane" style directional arrow
            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            ctx.moveTo(0, -cellSize * 0.8);             // Nose
            ctx.lineTo(-cellSize * 0.5, cellSize * 0.6); // Back Left
            ctx.lineTo(0, cellSize * 0.3);              // Indent
            ctx.lineTo(cellSize * 0.5, cellSize * 0.6);  // Back Right
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }

        function animate() {
            requestAnimationFrame(animate);
            stats.update();
            const dt = clock.getDelta();
            const time = clock.getElapsedTime();

            processSpawnQueue();

            let uploadCount = 0;
            while (textureUploadQueue.length > 0 && uploadCount < config.maxUploadsPerFrame) {
                const tex = textureUploadQueue.shift();
                tex.needsUpdate = true; 
                if (renderer) renderer.initTexture(tex);
                uploadCount++;
            }
            
            const parallaxStrength = 0.05;
            
            if (config.mode === 'floating') {
                let targetX = Math.sin(time * config.wobbleSpeed) * config.wobbleStrength * 5;
                let targetY = Math.cos(time * config.wobbleSpeed * 0.7) * config.wobbleStrength * 3;
                targetX += (mouse.x * 20 - targetX) * parallaxStrength;
                targetY += (mouse.y * 20 - targetY) * parallaxStrength;
                camera.position.x += (targetX - camera.position.x) * 0.1;
                camera.position.y += (targetY - camera.position.y) * 0.1;
                camera.rotation.z = Math.sin(time * config.wobbleSpeed * 0.3) * 0.1 * config.wobbleStrength;

                for (let i = imageCards.length - 1; i >= 0; i--) {
                    const card = imageCards[i];
                    card.mesh.position.z += config.cameraSpeed * card.velocity * dt * 10;
                    if (!config.noRotation) {
                        card.mesh.rotation.x += card.rotationSpeed.x * dt;
                        card.mesh.rotation.y += card.rotationSpeed.y * dt;
                        card.mesh.rotation.z += card.rotationSpeed.z * dt;
                    } else card.mesh.rotation.set(0,0,0);
                    
                    if (card.mesh.position.z > 50) {
                        scene.remove(card.mesh);
                        safeDisposeMaterial(card.mesh.material);
                        imageCards.splice(i, 1);
                        spawnFloatingImage(); 
                    }
                }
            } else if (config.mode === 'tunnel') {
                let targetX = Math.sin(time * config.wobbleSpeed) * config.wobbleStrength * 5;
                let targetY = Math.cos(time * config.wobbleSpeed * 0.7) * config.wobbleStrength * 3;
                targetX += (mouse.x * 10 - targetX) * parallaxStrength;
                targetY += (mouse.y * 10 - targetY) * parallaxStrength;
                camera.position.x += (targetX - camera.position.x) * 0.1;
                camera.position.y += (targetY - camera.position.y) * 0.1;
                camera.rotation.z = Math.sin(time * config.wobbleSpeed * 0.3) * 0.1 * config.wobbleStrength;
                const moveDist = config.cameraSpeed * dt * 30; 
                
                for (let i = imageCards.length - 1; i >= 0; i--) {
                    const card = imageCards[i];
                    card.mesh.position.z += moveDist;
                    if (card.mesh.position.z > 50) {
                        const currentZ = card.mesh.position.z;
                        const newZ = currentZ - tunnelGrid.totalDepth - moveDist; 
                        const col = card.colIndex;
                        scene.remove(card.mesh);
                        if (card.mesh.geometry) {
                            card.mesh.geometry.dispose();
                        }
                        if (card.mesh.material) safeDisposeMaterial(card.mesh.material);
                        imageCards.splice(i, 1);
                        spawnQueue.push({
                            type: 'tunnel',
                            x: 0, y: 0, z: newZ,
                            rotationZ: (col * tunnelGrid.segmentAngle) + Math.PI / 2,
                            colIndex: col,
                            onComplete: (mesh) => { imageCards.push({ mesh, colIndex: col }); }
                        });
                    }
                }
            } else if (config.mode === 'grid') {
                const moveDist = config.cameraSpeed * dt * 100;
                if (!isNaN(currentGridTarget.x) && !isNaN(currentGridTarget.y)) {
                    const lookX = currentGridTarget.x + (mouse.x * 50);
                    const lookY = currentGridTarget.y + (mouse.y * 50);
                    camera.position.x += (lookX - camera.position.x) * dt * (config.cameraSpeed * 0.5);
                    camera.position.y += (lookY - camera.position.y) * dt * (config.cameraSpeed * 0.5);
                }
                gridLayers.forEach(group => {
                    group.position.z += moveDist;
                    if (group.position.z > 150) {
                        recycleGridLayer(group);
                    }
                });
            } else if (config.mode === 'maze') {
                if (mazeGrid && mazeNav.phase !== 'idle' && !mazeRegenerating) {
                    updateMazeCamera(dt);
                }
                // Floor and ceiling remain stationary to avoid texture sliding.
                updateSpotlightAssignments();
                
                if (mazeExitObject) {
                    mazeExitObject.mesh.rotation.y += dt;
                    mazeExitObject.mesh.rotation.z += dt * 0.5;
                    mazeExitObject.mesh.position.y = MAZE_CELL_SIZE * 0.6 + Math.sin(time * 2) * 1.5;
                }

                // Update the 2D map overlay
                updateMazeMap();
            }

            lights.forEach(l => {
                l.mesh.position.z += config.lightSpeed * 1.5 * dt * 10;
                l.light.position.copy(l.mesh.position);
                if (l.mesh.position.z > 100) {
                    l.mesh.position.z = -1000 - Math.random() * 200;
                    l.mesh.position.set((Math.random()*2-1)*config.tunnelRadius, (Math.random()*2-1)*config.tunnelRadius, l.mesh.position.z);
                    l.light.position.copy(l.mesh.position);
                }
            });
            scene.fog.density = config.fogDensity;
            
            if (config.useStereo && stereoEffect) {
                stereoEffect.render(scene, camera);
            } else {
                renderer.render(scene, camera);
            }
        }

        function setupLights() {
            lights.forEach(l => { scene.remove(l.mesh); scene.remove(l.light); });
            lights = [];
            if (config.mode === 'maze') {
                setupMazeSpotlights();
                return;
            }
            for (let i = 0; i < config.lightCount; i++) createMovingLight();
        }

        function createMovingLight() {
            const color = config.lightColorMode === 'random' ? new THREE.Color().setHSL(Math.random(), 1, 0.5) : new THREE.Color(0xffffff);
            const light = new THREE.PointLight(color, config.lightIntensity, 600);
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 8), new THREE.MeshBasicMaterial({ color: color }));
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * config.tunnelRadius * 0.8;
            mesh.position.set(Math.cos(angle) * radius, Math.sin(angle) * radius, -Math.random() * 1000);
            light.position.copy(mesh.position);
            scene.add(mesh); scene.add(light);
            lights.push({ mesh, light });
        }

        function handleModeChange(newMode) {
            const previousSettings = modeStore[currentModeName];
            stateKeys.forEach(key => {
                if (config[key] !== undefined) {
                    previousSettings[key] = config[key];
                }
            });
            currentModeName = newMode;
            const targetSettings = modeStore[newMode];
            stateKeys.forEach(key => {
                if (targetSettings[key] !== undefined) {
                    config[key] = targetSettings[key];
                }
            });
            
            updateStereoSettings();
            // IMPORTANT: Update anisotropy immediately upon mode switch so cached textures are ready
            updateAnisotropy();

            if (ambientLight) ambientLight.intensity = config.ambientIntensity;
            if (newMode !== 'maze') {
                setupLights();
            } else {
                // Clear any leftover moving lights; maze uses its own SpotLight pool
                lights.forEach(l => { scene.remove(l.mesh); scene.remove(l.light); });
                lights = [];
            }
            for (const key in guiControllers) {
                if(guiControllers[key]) guiControllers[key].updateDisplay();
            }
            rebuildScene();
        }

        function setupGUI() {
            const gui = new GUI({ title: 'Settings' });
            
            gui.add(config, 'mode', ['floating', 'tunnel', 'grid', 'maze']).name('Display Mode').onChange(v => {
               handleModeChange(v);
            });

            const folderGen = gui.addFolder('General');
            folderGen.add(config, 'showStats').name('Show Performance').onChange(v => stats.dom.style.display = v ? 'block' : 'none');
            
            folderGen.add(config, 'useStereo').name('3D SBS Mode').onChange(() => updateStereoSettings());
            
            guiControllers.stereoEyeSep = folderGen.add(config, 'stereoEyeSep', 0, 2).name('3D Separation').onChange(v => {
                if(stereoEffect) {
                    if (typeof stereoEffect.setEyeSeparation === 'function') {
                        stereoEffect.setEyeSeparation(v);
                    } else {
                        stereoEffect.eyeSeparation = v;
                    }
                }
            });
            guiControllers.stereoFOVBoost = folderGen.add(config, 'stereoFOVBoost', 0, 80).name('SBS FOV Widen').onChange(() => updateStereoSettings());
            
            folderGen.add(config, 'toggleFullscreen').name('⛶ Toggle Fullscreen'); 
            folderGen.add(config, 'saveSettings').name('💾 Save Config');

            guiControllers.cameraSpeed = folderGen.add(config, 'cameraSpeed', 0.1, 4.0).name('Speed');
            guiControllers.fogDensity = folderGen.add(config, 'fogDensity', 0, 0.01).name('Fog Density');
            
            const folderGeom = gui.addFolder('Geometry');
            guiControllers.tunnelRadius = folderGeom.add(config, 'tunnelRadius', 10, 100).name('Tunnel/Float Radius').onChange(() => rebuildScene());
            guiControllers.imageSize = folderGeom.add(config, 'imageSize', 30, 90).name('Image Size').onChange(() => rebuildScene());
            guiControllers.tunnelRows = folderGeom.add(config, 'tunnelRows', 1, 50, 1).name('Tunnel Depth').onChange(() => rebuildScene());
            
            guiControllers.gridCols = folderGeom.add(config, 'gridCols', 2, 20, 1).name('Grid Width').onChange(() => rebuildScene());
            guiControllers.gridRows = folderGeom.add(config, 'gridRows', 2, 20, 1).name('Grid Height').onChange(() => rebuildScene());
            guiControllers.gridSpacing = folderGeom.add(config, 'gridSpacing', 100, 1000, 10).name('Grid Spacing').onChange(() => rebuildScene());
            guiControllers.pathRandomness = folderGeom.add(config, 'pathRandomness', 0, 1).name('Path Randomness');
            guiControllers.gridEdgeBuffer = folderGeom.add(config, 'gridEdgeBuffer', 0, 5, 1).name('Edge Buffer');

            guiControllers.totalImages = folderGeom.add(config, 'totalImages', 10, 500, 1)
                .name('Float Count').onFinishChange(() => textureManager.resetAndReload());

            const folderImg = gui.addFolder('Images');
            folderImg.add(config, 'quality', ['full', 'half', 'quarter']).name('Resolution').onChange(() => textureManager.loadNumberedSequence());
            
            // --- NEW ANISOTROPY CONTROL ---
            const maxAniso = renderer.capabilities.getMaxAnisotropy();
            guiControllers.anisotropyLevel = folderImg.add(config, 'anisotropyLevel', 1, maxAniso, 1)
                .name('Anisotropy (Sharpness)')
                .onChange(() => updateAnisotropy());
            // ------------------------------

            guiControllers.tunnelRotation = folderImg.add(config, 'tunnelRotation', [0, 90, 180, 270]).name('Image Rotation').onChange(() => rebuildScene());
            guiControllers.spinSpeed = folderImg.add(config, 'rotationSpeed', 0, 5).name('Spin Speed');
            guiControllers.noRotation = folderImg.add(config, 'noRotation').name('Stop Rotation');
            folderImg.add(config, 'opacity', 0, 1).onChange(v => {
                if(config.mode==='grid') gridLayers.forEach(g => g.children.forEach(m => m.material.opacity = v));
                else imageCards.forEach(c => c.mesh.material.opacity = v)
            });

            const folderServer = gui.addFolder('Server / Local Images');
            folderServer.add(config, 'serverPath', ['transparentimages', 'movieposters', 'images', 'AIimages'])
                .name('Image Folder')
                .onChange(value => {
                    config.serverStart = 1;
                    textureManager.loadNumberedSequence();
                });
            
            const subFolderManual = folderServer.addFolder('Numbered Fallback');
            subFolderManual.add(config, 'serverStart').name('Start #').listen();
            guiControllers.serverEnd = subFolderManual.add(config, 'serverEnd').name('End #').listen();
            subFolderManual.add(config, 'loadSequence').name('🔢 Reload Range');
            
            const folderContent = gui.addFolder('Content Actions');
            folderContent.add(config, 'uploadImages').name('📂 Upload Local Files');
            folderContent.add(config, 'clearImages').name('❌ Clear All Custom');
            
            guiMazeFolder = gui.addFolder('Maze');
            guiControllers.showMazeMap = guiMazeFolder.add(config, 'showMazeMap').name('Show Minimap');
            guiControllers.mazeComplexity = guiMazeFolder.add(config, 'mazeComplexity', 11, 41, 2)
                .name('Maze Size')
                .onFinishChange(() => { if (config.mode === 'maze') rebuildScene(); });
            guiControllers.mazeImageCount = guiMazeFolder.add(config, 'mazeImageCount', 5, 200, 1)
                .name('Image Count')
                .onFinishChange(() => { if (config.mode === 'maze') rebuildScene(); });
            guiControllers.mazeSpotlightAngle = guiMazeFolder.add(config, 'mazeSpotlightAngle', 0.1, Math.PI / 2)
                .name('Spotlight Size')
                .onChange(() => { if (config.mode === 'maze') setupLights(); });
            guiControllers.mazeSpotlightHeight = guiMazeFolder.add(config, 'mazeSpotlightHeight', 2.0, 15.0)
                .name('Spotlight Height');
            guiControllers.mazeShadowRes = guiMazeFolder.add(config, 'mazeShadowRes', [256, 512, 1024, 2048, 4096, 8192])
                .name('Shadow Resolution')
                .onChange(() => { if (config.mode === 'maze') setupLights(); });
            guiControllers.mazeWalkingSpeed = guiMazeFolder.add(config, 'mazeWalkingSpeed', 0.2, 5.0)
                .name('Walking Speed');
            guiControllers.mazeTextureTiling = guiMazeFolder.add(config, 'mazeTextureTiling', 0.5, 8.0)
                .name('Texture Tiling')
                .onChange(() => { if (materialManager) materialManager.updateTiling(); });
            guiControllers.navStyle = guiMazeFolder.add(config, 'navStyle', ['win95', 'modern'])
                .name('Nav Style');
            guiControllers.mazeWallTexture = guiMazeFolder.add(config, 'mazeWallTexture', config.availableTextures)
                .name('Wall Texture')
                .onChange(async v => { if (materialManager) await materialManager.load('wall', v); });
            guiControllers.mazeFloorTexture = guiMazeFolder.add(config, 'mazeFloorTexture', config.availableTextures)
                .name('Floor Texture')
                .onChange(async v => { if (materialManager) await materialManager.load('floor', v); });
            guiControllers.mazeCeilingTexture = guiMazeFolder.add(config, 'mazeCeilingTexture', config.availableTextures)
                .name('Ceiling Texture')
                .onChange(async v => { if (materialManager) await materialManager.load('ceiling', v); });

            const folderLight = gui.addFolder('Lighting & Performance');
            guiControllers.lightSpeed = folderLight.add(config, 'lightSpeed', 0, 30);
            guiControllers.ambientIntensity = folderLight.add(config, 'ambientIntensity', 0, 3).name('Ambient Brightness').onChange(v => {
                if (ambientLight) ambientLight.intensity = v;
            });
            guiControllers.maxUploadsPerFrame = folderLight.add(config, 'maxUploadsPerFrame', 1, 20, 1).name('Textures / Frame');

            guiControllers.lightCount = folderLight.add(config, 'lightCount', 0, 20, 1).onFinishChange(() => setupLights());
            guiControllers.lightIntensity = folderLight.add(config, 'lightIntensity', 0, 3000).onChange(() => setupLights());
            guiControllers.lightColorMode = folderLight.add(config, 'lightColorMode', ['random', 'white']).onChange(() => setupLights());
            
            gui.close();
            window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'h') gui.show(gui._hidden); });
            updateGUIVisibility();
        }

        function updateGUIVisibility() {
            if (!guiControllers.spinSpeed) return;
            guiControllers.spinSpeed.hide();
            guiControllers.noRotation.hide();
            guiControllers.tunnelRotation.hide();
            guiControllers.tunnelRows.hide();
            guiControllers.totalImages.hide();
            guiControllers.tunnelRadius.hide();
            guiControllers.gridCols.hide();
            guiControllers.gridRows.hide();
            guiControllers.gridSpacing.hide();
            guiControllers.pathRandomness.hide();
            guiControllers.gridEdgeBuffer.hide();
            if (guiMazeFolder) guiMazeFolder.hide();

            if (config.mode === 'tunnel') {
                guiControllers.tunnelRotation.show();
                guiControllers.tunnelRows.show();
                guiControllers.tunnelRadius.show();
            } else if (config.mode === 'floating') {
                guiControllers.spinSpeed.show();
                guiControllers.noRotation.show();
                guiControllers.totalImages.show();
                guiControllers.tunnelRadius.show();
            } else if (config.mode === 'grid') {
                guiControllers.gridCols.show();
                guiControllers.gridRows.show();
                guiControllers.gridSpacing.show();
                guiControllers.pathRandomness.show();
                guiControllers.gridEdgeBuffer.show();
            } else if (config.mode === 'maze') {
                if (guiMazeFolder) guiMazeFolder.show();
            }
        }

        function setupEvents() {
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });

            const fileInput = document.getElementById('image-uploader');
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    textureManager.clearUserTextures();
                    Array.from(e.target.files).forEach(file => textureManager.addUserTexture(file));
                }
            });
            document.body.addEventListener('dragover', (e) => e.preventDefault());
            document.body.addEventListener('drop', (e) => {
                e.preventDefault();
                if (e.dataTransfer.files.length > 0) {
                    textureManager.clearUserTextures();
                    Array.from(e.dataTransfer.files).forEach(file => { if (file.type.startsWith('image/')) textureManager.addUserTexture(file); });
                }
            });
        }

        init();
    </script>
</body>
</html>
